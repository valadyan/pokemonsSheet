<div [routerLink]="['']">
  <button class="backButton"> <- </button>
</div>

@let imgs = images$ | async;
<div class="photo">
  <gallery [items]="imgs!"></gallery>
</div>

@let pokemon = pokemonData$ | async;
<table>
  <tbody>
    <tr>
      <th scope="row">Name</th>
      <td>{{pokemon?.name}}</td>
    </tr>
    <tr>
      <th scope="row">base_experience</th>
      <td>{{pokemon?.base_experience}}</td>
    </tr>
    <tr>
      <th scope="row">height</th>
      <td>{{pokemon?.height}}</td>
    </tr>
    <tr>
      <th scope="row">weight</th>
      <td>{{pokemon?.weight}}</td>
    </tr>
    <tr>
      <th scope="row">order</th>
      <td>{{pokemon?.order}}</td>
    </tr>
  </tbody>
</table>

<div class="nextPrevButt">
  <div [routerLink]="['/card', (pokemonId()-1)]">
    <button> <- </button>
  </div>

  <div [routerLink]="['/card', (pokemonId()+1)]">
    <button> ->да ёбаные кнопки идите нахуй пока что </button>
  </div>
</div>
