<div [routerLink]="['']">
  <button class="backButton"> <- </button>
</div>

<div class="photo">
  <gallery [items]="images"></gallery>
</div>

<table>
  <tbody>
    <tr>
      <th scope="row">Name</th>
      <td>{{pokemonData.name}}</td>
    </tr>
    <tr>
      <th scope="row">base_experience</th>
      <td>{{pokemonData.base_experience}}</td>
    </tr>
    <tr>
      <th scope="row">height</th>
      <td>{{pokemonData.height}}</td>
    </tr>
    <tr>
      <th scope="row">weight</th>
      <td>{{pokemonData.weight}}</td>
    </tr>
    <tr>
      <th scope="row">order</th>
      <td>{{pokemonData.order}}</td>
    </tr>
  </tbody>
</table>

<div class="nextPrevButt">
  <div [routerLink]="['/card', (pokemonId()-1)]">
    <button> <- </button>
  </div>

  <div [routerLink]="['/card', (+pokemonId()+1)]">
    <button> ->да ёбаные кнопки идите нахуй пока что </button>
  </div>
</div>
